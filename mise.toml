[tools]
go = "1.27"
goreleaser = "2.18.2"
golangci-lint = "latest"
syft = "1.52.0"
"go:github.com/google/go-licenses" = "1.6.0"
"go:github.com/icholy/gomajor" = "0.15.0"

[tasks."dev"]
description = "Runs the application"
run = "go run cmd/shiphoist/main.go"

[tasks.test]
description = "Runs all tests in the project"
run = "go test -short ./..."

[tasks."test:v"]
description = "Runs all tests in the project with verbose output"
run = "go test -v -short ./..."

[tasks."test:all"]
description = "Runs all tests including the live-registry integration tests (requires network)"
run = "go test ./..."

[tasks."test:race"]
description = "Runs all tests with the race detector"
run = "go test -short -race ./..."

[tasks."test:cover"]
description = "Runs all tests in the project and writes coverage.out"
run = "go test -short -coverprofile=coverage.out ./..."

[tasks."test:cover-view"]
description = "Opens the HTML coverage report in the browser"
run = "go tool cover -html=coverage.out"
depends = ["test:cover"] 

[tasks.lint]
description = "Runs golangci-lint"
run = "golangci-lint run"

[tasks."lint:fix"]
description = "Formats code standardly and runs linter auto-fixes"
run = """
go fmt ./...
golangci-lint run --fix
"""

[tasks."deps:update"]
description = "Update all dependencies across the project"
run = """
  mise up --bump --interactive
  go get -u -t ./...
  go mod tidy
  gomajor list
  npx actions-up
"""

[tasks."licenses:check"]
description = "Checks if dependencies use allowed licenses"
run = "go-licenses check ./..."

[tasks."licenses:save"]
description = "Downloads license texts for releases"
run = "go-licenses save ./... --save_path=./oss-licenses --force"

[tasks."build:local"]
description = "Builds a quick local binary (no archives/cross-compilation)"
run = "goreleaser build --single-target --clean --snapshot"

[tasks."release:check"]
description = "Validates the goreleaser config"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "Builds a local snapshot release (no publishing, but with SBOM and archives)"
run = "goreleaser release --snapshot --clean --skip=publish"
depends = ["licenses:save"]
