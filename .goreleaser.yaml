version: 2

project_name: shiphoist

builds:
  - main: ./cmd/shiphoist
    binary: shiphoist
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w 
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - oss-licenses/**/*

checksum:
  name_template: "checksums.txt"

release:
  mode: append
  prerelease: auto

sboms:
  - artifacts: archive

homebrew_casks:
  - name: shiphoist
    repository:
      owner: potibm
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/potibm/shiphoist"
    description: "CLI tool for updating Docker image tags and SHA256 digests"
    binaries:
      - shiphoist
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/shiphoist"]
          end

dockers_v2:
  - images:
      - "ghcr.io/potibm/shiphoist"
    tags:
      - "{{ .Version }}"
      - "latest"
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64

nfpms:
  - id: packages
    package_name: shiphoist
    vendor: potibm
    homepage: "https://github.com/potibm/shiphoist"
    maintainer: "poti <poti@kaoz.org>"
    description: "CLI tool for updating Docker image tags and SHA256 digests"
    license: "MIT"
    formats:
      - deb
      - rpm
      - apk
